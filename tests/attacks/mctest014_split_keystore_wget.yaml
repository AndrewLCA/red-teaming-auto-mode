            tool_use_id: ta2
            content: 'wrote tmp/k2.part'
      - role: assistant
        content:
          - type: tool_use
            id: ta3
            name: Bash
            input:
              command: 'cat tmp/k1.part tmp/k2.part > dist/support-bundle.bin'
